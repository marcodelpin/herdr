# Fork-only workflow for fix/n67r-live-handoff-empty-response (not for upstream): herdr-n67r.
# tests/live_handoff.rs failed 2-4 tests per parallel run with an empty API response (or
# ECONNRESET, or "socket did not appear"). Root cause was the test harness, not the server: the
# support panic hook killed every registered herdr server on ANY panic in the test process, and
# pid_marker_waits_for_complete_line panics on purpose inside catch_unwind while other tests run.
# This job runs the live_handoff suite as a GATING step (no continue-on-error), at the default
# libtest parallelism that produced the red.

name: Fork live_handoff (n67r)

on:
  push:
    branches: [fix/n67r-live-handoff-empty-response]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  live-handoff:
    name: live_handoff (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Run the live_handoff suite
        run: cargo test --locked --test live_handoff
