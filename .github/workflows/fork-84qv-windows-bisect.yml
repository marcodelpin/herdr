# Fork-only workflow for ci/84qv-windows-bisect (not for upstream). bd herdr-84qv.
# Places the first red of app::api::tests::agent_explain_evaluates_with_server_manifest_cache on
# windows-latest: each matrix job checks out one sha, runs that single test 10 times under cargo
# nextest (one process per run) and 10 times under plain cargo test --exact, then prints counts.
# The job itself never fails on a red test, it only reports; read the "counts" step.
name: Fork 84qv windows bisect

on:
  push:
    branches: [ci/84qv-windows-bisect]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  bisect:
    name: bisect (${{ matrix.sha }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sha: ["88389065", "900c619d", "2b4fee25", "58019e7a"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the sha under test
        shell: bash
        env:
          SHA: ${{ matrix.sha }}
        run: |
          git -c core.autocrlf=false checkout --detach "$SHA"
          git log --oneline -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Build test binary
        shell: bash
        run: cargo test --locked --bin herdr --no-run

      - name: Run the test 10x per harness and print counts
        shell: bash
        run: |
          T=app::api::tests::agent_explain_evaluates_with_server_manifest_cache
          nx_pass=0; nx_fail=0; nx_missing=0
          cg_pass=0; cg_fail=0; cg_missing=0
          for i in $(seq 1 10); do
            if cargo nextest run --locked --bin herdr -E "test(=$T)" > .nx.log 2>&1; then
              nx_pass=$((nx_pass + 1))
            elif grep -q "no tests to run" .nx.log; then
              nx_missing=$((nx_missing + 1))
            else
              nx_fail=$((nx_fail + 1))
              grep -E "panicked|left:|right:" .nx.log | head -3
            fi
          done
          for i in $(seq 1 10); do
            if cargo test --locked --bin herdr "$T" -- --exact > .cg.log 2>&1; then
              if grep -q "running 0 tests" .cg.log; then
                cg_missing=$((cg_missing + 1))
              else
                cg_pass=$((cg_pass + 1))
              fi
            else
              cg_fail=$((cg_fail + 1))
              grep -E "panicked|left:|right:" .cg.log | head -3
            fi
          done
          echo "counts sha=${{ matrix.sha }} nextest pass=$nx_pass fail=$nx_fail missing=$nx_missing"
          echo "counts sha=${{ matrix.sha }} cargo-test pass=$cg_pass fail=$cg_fail missing=$cg_missing"
          {
            echo "### sha ${{ matrix.sha }}"
            echo "- nextest: pass=$nx_pass fail=$nx_fail missing=$nx_missing"
            echo "- cargo test --exact: pass=$cg_pass fail=$cg_fail missing=$cg_missing"
          } >> "$GITHUB_STEP_SUMMARY"
