# Fork-only workflow for ci/84qv-windows-bisect (not for upstream). bd herdr-84qv.
# Step 2 (runs 37406207946 and 37757041739): on a fresh VM the full suite under nextest passed 4 of 4.
# Step 3: a contamination contrast on ONE windows-latest VM at 58019e7a. Arm "fresh" probes
# agent_explain_evaluates_with_server_manifest_cache before anything ran; plain `cargo test` then
# runs the suite twice, as the hcdo arms did; arm "dirty" probes the test and runs the full nextest
# suite; arm "moved" repeats both after the herdr dirs under %APPDATA% and %LOCALAPPDATA% are moved
# aside. Each arm lists those directories. The job reports, it does not fail on a red test.
# Run 37758806528 reproduced the failure after cargo test but listed only "herdr": a test build has
# debug_assertions, so app_dir_name() is "herdr-dev" (src/config/io.rs). Both names are covered now.
name: Fork 84qv windows bisect

on:
  push:
    branches: [ci/84qv-windows-bisect]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  bisect:
    name: bisect (${{ matrix.sha }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sha: ["58019e7a"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the sha under test
        shell: bash
        env:
          SHA: ${{ matrix.sha }}
        run: |
          git -c core.autocrlf=false checkout --detach "$SHA"
          git log --oneline -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Build test binary
        shell: bash
        run: cargo test --locked --bin herdr --no-run

      - name: Contamination contrast
        shell: bash
        env:
          # Plain output: with colour on, "^\s+FAIL" never matches and a red run counts 0 failures.
          CARGO_TERM_COLOR: never
        run: |
          T='test(=app::api::tests::agent_explain_evaluates_with_server_manifest_cache)'
          A=$(cygpath -u "$APPDATA")
          L=$(cygpath -u "$LOCALAPPDATA")
          state() {
            for d in "$A/herdr" "$A/herdr-dev" "$L/herdr" "$L/herdr-dev"; do
              if [ -d "$d" ]; then
                echo "--- $d: $(find "$d" -type f | wc -l) files"
                find "$d" -type f -printf '%TY-%Tm-%Td %TH:%TM %9s %P\n' | sort | head -80
              else
                echo "--- $d: absent"
              fi
            done
          }
          probe() { # <arm>: the one test under nextest, 3 times
            for i in 1 2 3; do
              rc=0
              cargo nextest run --locked --bin herdr -E "$T" --failure-output final > ".probe-$1-$i.log" 2>&1 || rc=$?
              echo "probe $1 run=$i rc=$rc $(grep -aE '^\s+Summary ' ".probe-$1-$i.log" | tail -1)"
              grep -aE 'panicked at|left:|right:' ".probe-$1-$i.log" | head -3 || true
              echo "$rc" >> ".rc-$1"
            done
          }
          full_nextest() { # <arm>: the whole suite under nextest, once
            rc=0
            cargo nextest run --locked --bin herdr -E 'not binary(live_handoff)' \
              --no-fail-fast --failure-output final > ".full-$1.log" 2>&1 || rc=$?
            echo "full $1 rc=$rc $(grep -aE '^\s+Summary ' ".full-$1.log" | tail -1)"
            grep -aE '^\s+(FAIL|SIGABRT|SIGSEGV|TIMEOUT) ' ".full-$1.log" | sort -u | head -30 || true
            echo "$rc" >> ".rc-$1"
          }
          echo "=== arm fresh"
          state
          probe fresh
          echo "=== contaminate: plain cargo test --bin herdr, twice"
          for i in 1 2; do
            rc=0
            cargo test --locked --bin herdr > ".cargo-test-$i.log" 2>&1 || rc=$?
            echo "cargo test run=$i rc=$rc $(grep -aE '^test result:' ".cargo-test-$i.log" | tail -1)"
            grep -aE '^test .* \.\.\. FAILED' ".cargo-test-$i.log" | sort -u | head -30 || true
          done
          echo "=== arm dirty"
          state
          probe dirty
          full_nextest dirty
          echo "=== arm moved"
          for d in "$A/herdr" "$A/herdr-dev" "$L/herdr" "$L/herdr-dev"; do
            if [ -d "$d" ]; then mv "$d" "$d.moved-84qv"; echo "moved $d"; fi
          done
          state
          probe moved
          full_nextest moved
          v="fresh=[$(paste -sd, .rc-fresh)] dirty=[$(paste -sd, .rc-dirty)] moved=[$(paste -sd, .rc-moved)]"
          echo "VERDICT $v (probe rc x3, then the full-suite rc)"
          echo "### 84qv contamination contrast: $v" >> "$GITHUB_STEP_SUMMARY"
