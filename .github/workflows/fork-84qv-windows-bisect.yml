# Fork-only workflow for ci/84qv-windows-bisect (not for upstream). bd herdr-84qv.
# Step 2: ONE windows-latest job runs the FULL crate suite at 58019e7a three times in a row with the
# upstream ci.yml filter and nothing else running, to see whether the full-suite failure of
# agent_explain_evaluates_with_server_manifest_cache reproduces. The job never fails on a red
# test, it only reports; read the "counts" step.
name: Fork 84qv windows bisect

on:
  push:
    branches: [ci/84qv-windows-bisect]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  bisect:
    name: bisect (${{ matrix.sha }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sha: ["58019e7a"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the sha under test
        shell: bash
        env:
          SHA: ${{ matrix.sha }}
        run: |
          git -c core.autocrlf=false checkout --detach "$SHA"
          git log --oneline -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Build test binary
        shell: bash
        run: cargo test --locked --bin herdr --no-run

      - name: Full suite 3x, print failing test names and counts
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== run $i ==="
            rc=0
            cargo nextest run --locked --bin herdr -E 'not binary(live_handoff)' \
              --no-fail-fast --failure-output final > .nx$i.log 2>&1 || rc=$?
            echo "run=$i rc=$rc"
            grep -E "^\s+(FAIL|SIGABRT|SIGSEGV|TIMEOUT) " .nx$i.log | sort -u
            grep -E "^\s+Summary" .nx$i.log
            grep -E "agent_explain_evaluates_with_server_manifest_cache" .nx$i.log | head -5
            echo "run=$i failed_names=$(grep -E '^\s+FAIL ' .nx$i.log | sort -u | wc -l)"
            {
              echo "### run $i rc=$rc"
              grep -E "^\s+Summary" .nx$i.log
              grep -E '^\s+FAIL ' .nx$i.log | sort -u | head -50
            } >> "$GITHUB_STEP_SUMMARY"
          done
