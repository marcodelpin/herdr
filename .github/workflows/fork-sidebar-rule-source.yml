# Fork-only workflow for fix/sidebar-rule-source (not for upstream), bd herdr-upm: a sidebar token
# rule may name `source = "$<custom token>"` to read ANOTHER token of the same pane instead of the
# styled token's own value (the operator colours the machine name by `$ctx_num`, 50/80);
# the upstream numeric contract is unchanged. Runs the whole crate on both OSes, the new tests by name (a filter that
# matches nothing must fail, never pass), and one mutant: with the source lookup removed the new
# tests must go red.
name: Fork sidebar rule source (upm)

on:
  push:
    branches: [fix/sidebar-rule-source]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  crate-tests:
    name: crate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      # nextest runs one process per test, matching upstream `just ci` and this fork's own

      - name: Run the crate tests
        run: cargo nextest run --locked --bin herdr --status-level fail --final-status-level slow --failure-output final --success-output never

      - name: Run the new source-rule tests by name
        shell: bash
        run: |
          filter='test(/source_rules_read_another_token_and_accept_percent|source_must_be_a_custom_token_and_round_trips|machine_is_coloured_by_the_ctx_token/)'
          cargo nextest list --locked --bin herdr -E "$filter" --message-format oneline > upm-tests.txt
          n=$(wc -l < upm-tests.txt)
          echo "new tests matched: $n"
          if [ "$n" -ne 3 ]; then echo "expected 3 tests, got $n"; cat upm-tests.txt; exit 1; fi
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level pass --final-status-level all -E "$filter"

  mutant-source-lookup:
    name: mutant - the source lookup is load-bearing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      # nextest runs one process per test, matching upstream `just ci` and this fork's own

      - name: Ignore the source token and require the new tests to fail
        shell: bash
        run: |
          python3 - <<'EOF'
          p = "src/config/sidebar/rules.rs"
          s = open(p).read()
          old = "Some(name) => lookup(name).is_some_and(|other| rule.matches(other, &mut None)),"
          assert s.count(old) == 1, "mutation site not found"
          open(p, "w").write(s.replace(old, "Some(_name) => rule.matches(value, &mut None),"))
          EOF
          grep -c 'Some(_name) => rule.matches(value' src/config/sidebar/rules.rs
          cargo nextest run --locked --bin herdr --no-run
          rc=0
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level fail --success-output never -E 'test(/source_rules_read_another_token_and_accept_percent|machine_is_coloured_by_the_ctx_token/)' > mutant.log 2>&1 || rc=$?
          tail -20 mutant.log
          if [ "$rc" -eq 0 ]; then echo "MUTANT SURVIVED: the tests pass without the source lookup"; exit 1; fi
          grep -q 'FAIL' mutant.log || { echo "rc=$rc but no FAIL line: the tests did not run"; exit 1; }
          echo "mutant killed (rc=$rc)"
