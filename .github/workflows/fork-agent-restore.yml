      - name: Retarget the fingerprint strip at a nonexistent key and require the compatibility test to fail
        run: |
          sed -i 's/strip_json_key_recursive(&mut value, "agent_session_cwd");/strip_json_key_recursive(\&mut value, "agent_session_cwd_mutated" \/* MUTANT ar4 p2-3 fingerprint strip disabled *\/);/' src/persist/snapshot.rs
          landed=$(grep -c 'MUTANT ar4 p2-3 fingerprint strip disabled' src/persist/snapshot.rs || true)
          [ "$landed" = 1 ] || { echo "mutation did not land exactly once (landed=$landed)"; exit 1; }
          cargo nextest run --locked --bin herdr --no-run
          rc=0
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level fail --success-output never -E 'test(/::layout_fingerprint_ignores_agent_session_cwd_for_previous_reader_compatibility/)' > mutant.log 2>&1 || rc=$?
          cat mutant.log
          if [ "$rc" = 0 ]; then
            echo "MUTANT SURVIVED: the compatibility test passed with the strip retargeted at a nonexistent key"
            exit 1
          fi
          grep -q "FAIL.*layout_fingerprint_ignores_agent_session_cwd_for_previous_reader_compatibility" mutant.log || { echo "expected the compatibility test to FAIL"; exit 1; }
          echo "mutant killed: the compatibility test failed with the strip retargeted at a nonexistent key"

  build-linux:
    name: build herdr-linux-x86_64
    needs:
      [
        crate-tests,
        agent-restore-3ir-guard-inverted-mutant,
        agent-restore-3ir-guard-deleted-mutant,
        agent-restore-4r8-scoping-mutant,
        agent-restore-ct9-cwd-ignored-mutant,
        agent-restore-p1a-string-proc-start-mutant,
        agent-restore-p2c-amendment-same-id-passthrough-mutant,
        agent-restore-p2-amendment-cwd-survives-replacement-mutant,
        agent-restore-ar4-p2-1-duplicate-cwd-leak-mutant,
        agent-restore-ar4-p2-2-zombie-liveness-mutant,
        agent-restore-ar5-thread-group-check-mutant,
        agent-restore-ar4-p2-3-fingerprint-strip-mutant,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same LIBGHOSTTY_VT_* settings as preview.yml's release builds and
    # fork-14v-resume-launcher.yml (ReleaseFast / SIMD on) - the
    # build-artifacts-manual.yml input defaults (ReleaseSafe / false) would
    # silently swap the server's VT engine for a slower one.
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package artifact
        run: |
          cp target/x86_64-unknown-linux-musl/release/herdr herdr-linux-x86_64
          file herdr-linux-x86_64 > BUILD_INFO.txt
          ldd herdr-linux-x86_64 2>&1 | tee -a BUILD_INFO.txt
          grep -q "statically linked" BUILD_INFO.txt
          if nm -u herdr-linux-x86_64 2>/dev/null | grep -E '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then
            echo "error: Linux artifact has unresolved C++ runtime symbols" >&2
            exit 1
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "target=x86_64-unknown-linux-musl"
            echo "libghostty_vt_optimize=$LIBGHOSTTY_VT_OPTIMIZE"
            echo "libghostty_vt_simd=$LIBGHOSTTY_VT_SIMD"
          } >> BUILD_INFO.txt
          python3 -m pip install --quiet blake3
          python3 -c "import blake3, pathlib; artifact = pathlib.Path('herdr-linux-x86_64'); print(f'blake3={blake3.blake3(artifact.read_bytes()).hexdigest()}  {artifact.name}')" >> BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-linux-x86_64-agent-restore
          path: |
            herdr-linux-x86_64
            BUILD_INFO.txt
          retention-days: 7
