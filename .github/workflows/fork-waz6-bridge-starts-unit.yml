# Fork-only workflow for fix/waz6-bridge-starts-unit (not for upstream): the remote client bridge
# (src/remote/host.rs ensure_remote_server_running) used to run `herdr server` itself when no server
# was listening. On a host with the herdr.service systemd --user unit that server lived in the ssh
# session's cgroup, outside the unit, and the unit's socket-holder wait then refused to start and
# retried every ~16 s for ~50 h (dcc 2026-10-02..05, NRestarts 11,346). Now the bridge starts the
# unit when it is installed (default session, no socket override), never falls back to an unmanaged
# server when that start fails, and keeps the direct spawn only when no unit is installed.
# This host cannot build the crate (no Zig 0.16.0), so the tests run here. Each mutant removes one
# guard and must turn the named tests red. bd herdr-waz6.
name: Fork waz6 bridge starts unit

on:
  push:
    branches: [fix/waz6-bridge-starts-unit]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  crate-tests:
    name: crate tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Run the crate tests
        run: cargo nextest run --locked --bin herdr --status-level fail --final-status-level slow --failure-output final --success-output never

      - name: Run the fork tests by name
        run: |
          filter='test(/^remote::host::tests::/)'
          cargo nextest list --locked --bin herdr -E "$filter" --message-format oneline > fork-tests.txt
          cat fork-tests.txt
          count=$(grep -c . fork-tests.txt || true)
          expected=9
          [ "$count" = "$expected" ] || { echo "expected $expected fork tests, the filter matched $count"; exit 1; }
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level pass --final-status-level all -E "$filter"

  mutants:
    name: mutant - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit never chosen
            perl: 's/if unit_installed && !explicit_session && !socket_override \{/if false \&\& unit_installed \&\& !explicit_session \&\& !socket_override \/* MUTANT *\/ {/'
            expect: "plan_uses_the_unit_when_installed_on_the_default_session"
          - name: explicit session guard dropped
            perl: 's/if unit_installed && !explicit_session && !socket_override \{/if unit_installed \&\& !socket_override \/* MUTANT *\/ {/'
            expect: "plan_spawns_directly_for_an_explicit_session"
          - name: socket override guard dropped
            perl: 's/if unit_installed && !explicit_session && !socket_override \{/if unit_installed \&\& !explicit_session \/* MUTANT *\/ {/'
            expect: "plan_spawns_directly_for_a_socket_override"
          - name: unit always chosen
            perl: 's/if unit_installed && !explicit_session && !socket_override \{/if true \/* MUTANT *\/ {/'
            expect: "plan_spawns_directly_without_a_unit plan_spawns_directly_for_an_explicit_session plan_spawns_directly_for_a_socket_override"
          - name: failed unit start falls back to direct spawn
            perl: 's/            \}\)\?;\n            wait_for_socket\(UNIT_START_WAIT\)/            }).or_else(|_: io::Error| spawn_direct()).map_err(|e| e);\n            wait_for_socket(UNIT_START_WAIT)/'
            expect: "failed_unit_start_is_a_clear_error_without_fallback"
          - name: unit start error loses its explanation
            perl: 's/not starting an unmanaged server beside the unit/unit start failed/'
            expect: "failed_unit_start_is_a_clear_error_without_fallback"
          - name: no unit still starts the unit
            perl: 's/ServerStartPlan::DirectSpawn => \{\n            spawn_direct\(\)\?;/ServerStartPlan::DirectSpawn => {\n            start_unit()?;\n            spawn_direct()?;/'
            expect: "direct_plan_spawns_and_never_touches_the_unit"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Apply the mutant and require its tests to fail
        env:
          PERL_EXPR: ${{ matrix.perl }}
          EXPECT: ${{ matrix.expect }}
        run: |
          perl -0777 -pi -e "$PERL_EXPR" src/remote/host.rs
          git diff --stat -- src/remote/host.rs
          [ -n "$(git diff --name-only -- src/remote/host.rs)" ] || { echo "mutation did not land"; exit 1; }
          cargo nextest run --locked --bin herdr --no-run
          rc=0
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level fail --success-output never -E 'test(/^remote::host::tests::/)' > mutant.log 2>&1 || rc=$?
          cat mutant.log
          [ "$rc" != 0 ] || { echo "MUTANT SURVIVED: every host test passed"; exit 1; }
          for test in $EXPECT; do
            grep -q "FAIL.*$test" mutant.log || { echo "expected $test to FAIL, it did not"; exit 1; }
          done
          echo "mutant killed"
