# Fork-only workflow for fix/win-deploy-0921 (not for upstream): upstream preview-2026-09-21-0ff0f27e2226
# plus the fork client fixes herdr-qlk.2 (animated working icon), herdr-qlk.7 (WAITING / STALE icon)
# and herdr-7ak (the health probe timer starts at transmission). This host cannot build the crate
# (no Zig 0.16.0), so the crate tests run here on both platforms (nextest, one process per test), the
# fork's own tests run again by name with a count check so a green run cannot skip them, three
# mutants prove the new tests can go red, and the Windows package is built only once the tests
# pass, with the same steps as build-artifacts-manual.yml. bd herdr-yyd.
name: Fork win deploy 0921

on:
  push:
    branches: [fix/win-deploy-0921]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  crate-tests:
    name: crate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      # nextest runs one process per test, like `just ci` upstream. A plain `cargo test` binary
      # died with SIGPIPE (signal 13) in the plugins action tests on the first run of the
      # animated-working-indicator workflow (run 34568308787), taking every later test with it.
      - name: Run the crate tests
        run: cargo nextest run --locked --bin herdr --status-level fail --final-status-level slow --failure-output final --success-output never

      # The fork's own tests, by name: qlk.2 working_spinner, qlk.7 waiting_icon, and the seven
      # herdr-7ak tests in endpoint health / registry / writer. The count check fails the job if
      # a filter matches fewer tests than the fork added, so a green run that skipped them is red.
      - name: Run the fork tests by name
        shell: bash
        run: |
          filter='test(/client::shell::tests::(working_spinner|waiting_icon)::/) | test(/a_probe_queued_behind_a_draining_frame_never_expires_the_connection|the_probe_timer_starts_when_the_writer_accepted_the_ping|a_reply_satisfies_a_ping_that_is_still_queued|a_paste_that_is_still_draining_does_not_expire_a_quiet_endpoint|a_stalled_writer_is_still_cut_by_its_own_stall_timeout|a_tracked_frame_resolves_only_once_the_peer_has_taken_all_of_it|a_stalled_frame_never_reports_itself_transmitted/)'
          cargo nextest list --locked --bin herdr -E "$filter" --message-format oneline > fork-tests.txt
          cat fork-tests.txt
          count=$(grep -c . fork-tests.txt || true)
          [ "$count" = 38 ] || { echo "expected 38 fork tests, the filter matched $count"; exit 1; }
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level pass --final-status-level all -E "$filter"

  frozen-spinner-mutant:
    # The spinner frame comes from elapsed time. This proves
    # working_icon_differs_between_composes_at_different_times can go red: with the frame
    # index frozen at 0 the crate must still build and that test must fail.
    name: mutant - frozen spinner frame must be caught
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Freeze the spinner frame and require the test to fail
        run: |
          perl -0pi -e 's/\(elapsed\.as_millis\(\) \/ WORKING_SPINNER_FRAME_PERIOD\.as_millis\(\)\) as usize/0usize \/\/ MUTANT frozen frame/' src/client/shell.rs
          landed=$(grep -c 'MUTANT frozen frame' src/client/shell.rs || true)
          [ "$landed" = 1 ] || { echo "mutation did not land exactly once (landed=$landed)"; exit 1; }
          cargo test --locked --bin herdr --no-run
          if cargo test --locked --bin herdr client::shell::tests::working_spinner::working_icon_differs_between_composes_at_different_times; then
            echo "MUTANT SURVIVED: the differs-between-composes test passed with a frozen frame"
            exit 1
          fi
          echo "mutant killed: the test failed with the frame frozen"

  token-blind-display-state-mutant:
    # display_state is the whole feature: the WAITING / STALE state comes from the reported
    # tokens, nothing else. This proves the waiting_icon tests can go red - with the derivation
    # ignoring the tokens and always returning the plain status, the crate must still build and
    # the named tests must fail. A green suite here means the tests assert nothing.
    name: mutant - a token-blind display_state must be caught
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Ignore the reported tokens and require the waiting tests to fail
        run: |
          perl -0pi -e 's/if !waiting_indicator \|\| !display_state_overridable\(status\) \{/if true \{ \/\/ MUTANT token-blind display_state/' src/client/shell.rs
          landed=$(grep -c 'MUTANT token-blind display_state' src/client/shell.rs || true)
          [ "$landed" = 1 ] || { echo "mutation did not land exactly once (landed=$landed)"; exit 1; }
          cargo nextest run --locked --bin herdr --no-run
          rc=0
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level fail --success-output never -E 'test(client::shell::tests::waiting_icon::)' > mutant.log 2>&1 || rc=$?
          cat mutant.log
          if [ "$rc" = 0 ]; then
            echo "MUTANT SURVIVED: the waiting_icon tests passed with the tokens ignored"
            exit 1
          fi
          for test in an_idle_pane_with_a_wait_token_shows_a_blue_hourglass \
                      workspace_rows_roll_the_waiting_state_up_from_their_agents \
                      a_rollup_reads_each_aggregated_agents_own_display_state \
                      a_token_row_state_icon_the_clip_drops_schedules_no_repaint \
                      a_switcher_row_too_narrow_for_the_icon_schedules_no_repaint \
                      an_indented_switcher_row_too_narrow_for_the_icon_schedules_no_repaint \
                      an_unavailable_endpoints_waiting_row_keeps_the_static_hourglass; do
            grep -q "FAIL.*$test" mutant.log || { echo "expected $test to FAIL, it did not appear as a failure"; exit 1; }
          done
          echo "mutant killed: the waiting_icon tests failed with the tokens ignored"

  clip-blind-icon-mutant:
    # Every clock is marked only once the glyph is known to have reached the frame, and
    # icon_reached_frame is the single predicate that answers it - for the put_text sites, for the
    # mobile switcher items, and (through token_row_icon_reached_frame) for the token rows. This
    # proves the clipped-icon tests can go red: with the predicate always true the crate must still
    # build and every named test must fail. A green suite here means those tests assert nothing.
    name: mutant - a clip-blind icon_reached_frame must be caught
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Mark every clock unconditionally and require the clipped tests to fail
        run: |
          perl -0pi -e 's/written >= lead\.saturating_add\(render::display_width\(icon\)\)/true \/\/ MUTANT clip-blind icon_reached_frame/' src/client/shell.rs
          landed=$(grep -c 'MUTANT clip-blind icon_reached_frame' src/client/shell.rs || true)
          [ "$landed" = 1 ] || { echo "mutation did not land exactly once (landed=$landed)"; exit 1; }
          cargo nextest run --locked --bin herdr --no-run
          rc=0
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level fail --success-output never -E 'test(client::shell::tests::waiting_icon::)' > mutant.log 2>&1 || rc=$?
          cat mutant.log
          if [ "$rc" = 0 ]; then
            echo "MUTANT SURVIVED: the waiting_icon tests passed with every clipped glyph marked"
            exit 1
          fi
          for test in a_token_row_state_icon_the_clip_drops_schedules_no_repaint \
                      a_switcher_row_too_narrow_for_the_icon_schedules_no_repaint \
                      an_indented_switcher_row_too_narrow_for_the_icon_schedules_no_repaint \
                      a_mobile_header_icon_the_frame_has_no_room_for_schedules_no_repaint \
                      a_collapsed_endpoint_row_too_narrow_for_the_icon_schedules_no_repaint; do
            grep -q "FAIL.*$test" mutant.log || { echo "expected $test to FAIL, it did not appear as a failure"; exit 1; }
          done
          echo "mutant killed: the clipped-icon tests failed with the predicate always true"

  build-windows:
    name: build herdr-windows-x86_64
    needs: crate-tests
    runs-on: windows-latest
    timeout-minutes: 90
    # Same libghostty-vt settings as preview.yml, the channel the replaced client came from.
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Remove Zig caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip
          "commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 BUILD_INFO.txt
          "target=x86_64-pc-windows-msvc" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "libghostty_vt_optimize=$env:LIBGHOSTTY_VT_OPTIMIZE" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "libghostty_vt_simd=$env:LIBGHOSTTY_VT_SIMD" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          $hash = (Get-FileHash -Algorithm SHA256 herdr-windows-x86_64.zip).Hash.ToLowerInvariant()
          "sha256=$hash  herdr-windows-x86_64.zip" | Out-File -Encoding utf8 -Append BUILD_INFO.txt

      - name: Report the version the build carries
        shell: pwsh
        run: '& target\x86_64-pc-windows-msvc\release\herdr.exe --version'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-windows-x86_64-win-deploy-0921
          path: |
            herdr-windows-x86_64.zip
            BUILD_INFO.txt
          retention-days: 7
