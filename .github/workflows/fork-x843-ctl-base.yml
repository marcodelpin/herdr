# Positive control for herdr-x843: crate unit tests on the unmodified base fix/adopt-0.9.3 (88389065).
name: Fork x843 control base
on:
  push:
    branches: [fix/x843-ctl-base]
permissions:
  contents: read
env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
jobs:
  linux:
    name: crate tests base (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Crate unit tests
        run: cargo test --locked --bin herdr
