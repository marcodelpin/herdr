# Fork-only workflow for fix/waiting-state-icon (not for upstream). The fix branch is not a branch
# CI runs on, and this host cannot build the crate (zig 0.15.2). The full test binary runs on both
# platforms (nextest, one process per test); two mutants prove the new tests can go red; the Windows
# package is built only once the tests pass, with the same steps as build-artifacts-manual.yml.
# bd herdr-qlk.7.
name: Fork waiting state icon

on:
  push:
    branches: [fix/waiting-state-icon]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  crate-tests:
    name: crate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      # nextest runs one process per test, like `just ci` upstream. A plain `cargo test` binary
      # died with SIGPIPE (signal 13) in the plugins action tests on the first run of the
      # animated-working-indicator workflow (run 34568308787), taking every later test with it.
      - name: Run the crate tests
        run: cargo nextest run --locked --bin herdr --status-level fail --final-status-level slow --failure-output final --success-output never

  frozen-spinner-mutant:
    # The spinner frame comes from elapsed time. This proves
    # working_icon_differs_between_composes_at_different_times can go red: with the frame
    # index frozen at 0 the crate must still build and that test must fail.
    name: mutant - frozen spinner frame must be caught
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Freeze the spinner frame and require the test to fail
        run: |
          perl -0pi -e 's/\(elapsed\.as_millis\(\) \/ WORKING_SPINNER_FRAME_PERIOD\.as_millis\(\)\) as usize/0usize \/\/ MUTANT frozen frame/' src/client/shell.rs
          landed=$(grep -c 'MUTANT frozen frame' src/client/shell.rs || true)
          [ "$landed" = 1 ] || { echo "mutation did not land exactly once (landed=$landed)"; exit 1; }
          cargo test --locked --bin herdr --no-run
          if cargo test --locked --bin herdr client::shell::tests::working_spinner::working_icon_differs_between_composes_at_different_times; then
            echo "MUTANT SURVIVED: the differs-between-composes test passed with a frozen frame"
            exit 1
          fi
          echo "mutant killed: the test failed with the frame frozen"

  token-blind-display-state-mutant:
    # display_state is the whole feature: the WAITING / STALE state comes from the reported
    # tokens, nothing else. This proves the waiting_icon tests can go red - with the derivation
    # ignoring the tokens and always returning the plain status, the crate must still build and
    # the named tests must fail. A green suite here means the tests assert nothing.
    name: mutant - a token-blind display_state must be caught
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Ignore the reported tokens and require the waiting tests to fail
        run: |
          perl -0pi -e 's/if !waiting_indicator \|\| !matches!\(status, AgentStatus::Idle \| AgentStatus::Done\) \{/if true \{ \/\/ MUTANT token-blind display_state/' src/client/shell.rs
          landed=$(grep -c 'MUTANT token-blind display_state' src/client/shell.rs || true)
          [ "$landed" = 1 ] || { echo "mutation did not land exactly once (landed=$landed)"; exit 1; }
          cargo nextest run --locked --bin herdr --no-run
          rc=0
          cargo nextest run --locked --bin herdr --no-fail-fast --status-level fail --success-output never -E 'test(client::shell::tests::waiting_icon::)' > mutant.log 2>&1 || rc=$?
          cat mutant.log
          if [ "$rc" = 0 ]; then
            echo "MUTANT SURVIVED: the waiting_icon tests passed with the tokens ignored"
            exit 1
          fi
          for test in an_idle_pane_with_a_wait_token_shows_a_blue_hourglass \
                      workspace_rows_roll_the_waiting_state_up_from_their_agents \
                      an_unavailable_endpoints_waiting_row_keeps_the_static_hourglass; do
            grep -q "FAIL.*$test" mutant.log || { echo "expected $test to FAIL, it did not appear as a failure"; exit 1; }
          done
          echo "mutant killed: the waiting_icon tests failed with the tokens ignored"

  build-windows:
    name: build herdr-windows-x86_64
    needs: crate-tests
    runs-on: windows-latest
    timeout-minutes: 90
    # Same libghostty-vt settings as preview.yml, the channel the replaced client came from.
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Remove Zig caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip
          "commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 BUILD_INFO.txt
          "target=x86_64-pc-windows-msvc" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "libghostty_vt_optimize=$env:LIBGHOSTTY_VT_OPTIMIZE" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "libghostty_vt_simd=$env:LIBGHOSTTY_VT_SIMD" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          $hash = (Get-FileHash -Algorithm SHA256 herdr-windows-x86_64.zip).Hash.ToLowerInvariant()
          "sha256=$hash  herdr-windows-x86_64.zip" | Out-File -Encoding utf8 -Append BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-windows-x86_64-waiting-state-icon
          path: |
            herdr-windows-x86_64.zip
            BUILD_INFO.txt
          retention-days: 7
